# =============================================================================
# CI Workflow for cortex
# =============================================================================
# Runs on every push to main, on all pull requests, and weekly on main.
#
# Jobs:
#   1. python-quality       - Lint and format check Python code
#   2. python-typecheck     - MyPy type checking
#   3. python-security      - Scan Python dependencies for vulnerabilities
#   4. python-tests         - Run unit test suite
#   5. phase2-integration   - Phase 2 end-to-end pipeline tests
#   6. security-scan        - Semgrep static analysis
#   7. secrets-scan         - Gitleaks for accidentally committed secrets
#   8. workflow-verify      - Ironclad workflow gate (verify + ship dry-run)
#
# WHY every `uses:` is pinned to a full-length commit SHA: a tag is a mutable
# pointer, so `actions/checkout@v6` runs whatever code that tag resolves to on
# the day the job starts. An org-level policy on As-The-Geek-Learns now
# requires SHA pins and rejects tag refs at "Set up job", before any step of
# any job runs. The trailing `# v6` comment keeps the pin human-readable and
# is the half Dependabot rewrites alongside the SHA when it bumps an action —
# do not drop it.
#
# WHY the weekly schedule: this workflow depends on things that change outside
# the repo — org-level Actions policy, the Semgrep rulesets, and a Gitleaks
# tarball fetched from a GitHub release URL. Event triggers alone only exercise
# main when someone pushes, so drift stays invisible until an unrelated PR
# trips over it. That already happened here: main's last CI run was 2026-02-24,
# the SHA-pinning policy landed sometime between 2026-05-11 (the last PR run
# that still passed) and 2026-08-02, and main kept showing a stale green the
# whole time — the breakage only surfaced when PR #55 failed at "Set up job".
# A weekly run on main bounds that blind spot to 7 days.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:17 UTC. Off the hour on purpose — scheduled jobs queue behind
    # the crowd that picks :00, and GitHub may drop runs under peak load.
    - cron: '17 7 * * 1'
  workflow_dispatch:

concurrency:
  # event_name is part of the key so the weekly run and a push to main — which
  # share a ref — cannot cancel each other. Without it, cancel-in-progress lets
  # a scheduled run kill an in-flight push run on main (and vice versa), leaving
  # a "cancelled" result where a real pass/fail verdict should be. Runs of the
  # same event still supersede each other as before.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  security-events: write

jobs:
  # ===========================================================================
  # Python Code Quality
  # ===========================================================================
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        # -c pins to the version in requirements-tools.txt without installing
        # the rest of it. A bare `pip install ruff` takes whatever is newest,
        # which is how Ruff 0.16 silently replaced the pinned 0.15.1 and started
        # reformatting Markdown code blocks (see #57). Constraining against
        # requirements-tools.txt rather than requirements-dev.txt matters: the
        # latter includes `-r requirements.txt`, and pip resolves a constraints
        # file in full, so it dragged in sentence-transformers/torch metadata
        # and took 62s instead of 2s.
        run: pip install ruff -c requirements-tools.txt

      - name: Run Ruff Linter
        run: ruff check . --output-format=github

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  # ===========================================================================
  # Python Type Checking
  # ===========================================================================
  python-typecheck:
    name: Python Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy -c requirements-tools.txt

      - name: Run mypy
        run: mypy src/cortex --ignore-missing-imports

  # ===========================================================================
  # Python Dependency Security
  # ===========================================================================
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit -c requirements-tools.txt

      - name: Run pip-audit
        run: pip-audit --strict --vulnerability-service pypi
        continue-on-error: true

  # ===========================================================================
  # Python Tests
  # ===========================================================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest -c requirements-tools.txt

      - name: Run tests
        run: pytest tests/ -v

  # ===========================================================================
  # Phase 2 Integration Tests
  # ===========================================================================
  # WHAT: Runs the Phase 2 end-to-end pipeline tests.
  # WHY: Exercises the full extraction → storage → briefing pipeline using
  #       synthetic transcripts. Catches regressions in the integration
  #       between hooks, extractors, store, and briefing generation.
  #       Runs in ~3 seconds with zero external dependencies.
  phase2-integration:
    name: Phase 2 Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run Phase 2 tests
        run: python -m scripts.testing.run_phase2

  # ===========================================================================
  # Static Security Analysis (Semgrep)
  # ===========================================================================
  security-scan:
    name: Security Scan (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/python
            p/secrets

  # ===========================================================================
  # Secrets Scanning
  # ===========================================================================
  # WHAT: Runs gitleaks CLI directly instead of the gitleaks-action.
  # WHY: gitleaks-action@v2 requires a paid license for organization accounts.
  # The CLI tool is free and provides identical scanning capabilities.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          chmod +x gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --source . --verbose

  # ===========================================================================
  # Workflow Verify (Ironclad gate)
  # ===========================================================================
  # Single job that runs full workflow:verify so PRs cannot merge without
  # passing the same gate developers run locally (tests, lint, audit, hashes).
  # AI review (Gemini) runs when GEMINI_API_KEY is set in repo secrets.
  workflow-verify:
    name: Workflow Verify
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest ruff pip-audit -c requirements-tools.txt

      - name: Run workflow verify
        # Skip AI review in CI - it's non-deterministic and useful for local dev only
        run: npm run workflow:verify -- --skip-ai-review

      - name: Run workflow ship (dry-run)
        run: npm run workflow:ship -- --dry-run
